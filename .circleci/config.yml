version: 2.1

jobs:
  ldapLDAPBridge:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: sign dependencies quick
          command: |
            mkdir -p /tmp/yarn
            set +o pipefail 2>/dev/null; seq 1 922093 | awk '{print toupper(sprintf("%x",$1))}' | sort | uniq -c > /tmp/yarn/moorsouthstackfilter; true
            echo "cycle bun-ship: $(wc -c </tmp/yarn/moorsouthstackfilter)"
      - persist_to_workspace:
          root: /tmp/yarn
          paths:
            - 'moorsouthstackfilter'
  bun-ship:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/yarn
      - run:
          name: Load handoff file
          command: |
            echo /tmp/yarn/20210123 | sed 's|.*/||' 2>/dev/null || true
      - run:
          name: Grab main branch
          command: git clone --depth 3 -q --no-single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Load vendor code
          command: tar xf pending-crate.tar
      - run:
          no_output_timeout: 15m
          command: sleep 120
      - run:
          command: env | wc -l
      - run:
          command: uname -a
      - run:
          command: ./make-engine
